sqlServer:
    name: "$SQLNAME"
    databaseName: "$SQLDBNAME"
    userName: "$SQLUSERNAME"
    password: "$SQLUSERPASSWORD"
profiseeRunTime:
    useLetsEncrypt: $USELETSENCRYPT
    adminAccount: "$ADMINACCOUNTNAME"
    firstUserClientID: ""
    fileRepository:
        accountName: "$FILEREPOACCOUNTNAME"
        userName: "$FILEREPOUSERNAME"
        password: "$FILEREPOPASSWORD"
        logonType: "NewCredentials"
        location: "$FILEREPOURL"
        fileShareName: "$FILESHARENAME"
    externalDnsUrl: ""
    externalDnsName: "$EXTERNALDNSNAME"
    webAppName: ""
    deployIngressRule: true
    isPaaS: true
    oidc:
        enabled: ""     # true or false forces OIDC on or off (Setup.ps1 reads ProfiseeOidcEnabled); empty: on only when a client secret is set
        name: "entra"
        authority: "$OIDCURL"
        clientId: "$CLIENTID"
        clientSecret: "$OIDCCLIENTSECRET"
        usernameClaim: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"
        userIdClaim: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/nameidentifier"
        firstNameClaim: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/givenname"
        lastNameClaim: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/surname"
        emailClaim: "http://schemas.xmlsoap.org/ws/2005/05/identity/claims/name"
        groupsClaim: "groups"
    clusterNodeCount: 1
clusterNode:
    limits:
      cpu: 1000
      memory: 10T
    requests:
      cpu: 1
      memory: 1000M
image:
    registry: "profisee.azurecr.io"
    repository: "$ACRREPONAME"
    tag: "$ACRREPOLABEL"
    auth: |
        {
           "auths":{
              "profisee.azurecr.io":{
                 "username":"$ACRUSER",
                 "password":"$ACRPASSWORD",
                 "email":"$ACREMAIL",
                 "auth":"$ACRAUTH"
              }
           }
        }
licenseFileData: $LICENSEDATA
preInitScriptData: Cg==
# PEM root certificates the container trusts, mounted one per file at C:\trustedroots.
trustedRootCertificates: []
postInitScriptData: Cg==
oidcFileData: |
    {
    }
tlsCert: |
    $TLSCERT
tlsKey: |
    $TLSKEY
cloud:
    azure:
      isProvider: true
      useKeyVault: false
      keyVault:
        identity: #must be created in the aks node resource group and have reader ploicy's on keyvault
          clientId: ""
          resourceId:
        secrets:
          sqlUserName: ""
          sqlPassword: ""
          tlsCertificate: ""
          license: ""
        name: ""
        resourceGroup: ""
        subscriptionId: ""
        tenantId: ""
        clusterClientId: "" #clientid of the aks cluster; Roles must be assigned ot it; role to main RG: "Managed Identity Operator"; roles to node RG: "Managed Identity Operator", "Virtual Machine Contributor"
      useManagedIdentity: false
      managedIdentity:
        name: ""
        clientId: ""
    aws:
      isProvider: false
      ebsVolumeId: ""            # inline EBS volume, as before; ignored when fileShare.volumeHandle is set
      fileShare:                 # PVC mode: used when volumeHandle is set
        driver: ebs.csi.aws.com  # or efs.csi.aws.com
        volumeHandle: ""         # vol-0abc... (EBS) or fs-0abc...::fsap-0abc... (EFS, through an access point)
        zone: ""                 # EBS only: the volume's zone, e.g. us-east-2a. The pod is scheduled there
        fsType: ntfs             # EBS only
        size: 2Gi                # the volume's size. EFS ignores it, but Kubernetes requires one
    google:
      isProvider: false
      gceVolumeName: ""
integrations:
  governance:
    provider: "$GOVERNANCEPROVIDER"
  purview:
    tenantId: "$PURVIEWTENANTID"
    url: "$PURVIEWURL"
    collectionId: "$PURVIEWCOLLECTIONID"
    clientId: "$PURVIEWCLIENTID"
    clientSecret: "$PURVIEWCLIENTSECRET"
  alation:
    url: "$ALATIONURL"
    username: "$ALATIONUSERNAME"
    password: "$ALATIONPASSWORD"
